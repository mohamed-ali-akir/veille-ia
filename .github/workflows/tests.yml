# =============================================================
#  TESTS : à chaque push et pull request
# =============================================================
#  La veille automatique lance déjà les tests avant de tourner,
#  mais seulement deux fois par jour. Ce workflow les lance dès
#  qu'un changement est poussé : une erreur est vue tout de suite.
# =============================================================

name: Tests

on:
  push:
    branches: [main]
    # Les commits automatiques de la veille ne touchent que les données
    paths-ignore: ["data/**", "docs/articles.json", "docs/flux.xml"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest -v tests
