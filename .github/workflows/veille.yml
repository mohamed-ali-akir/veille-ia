# =============================================================
#  ÉTAPE 4 : AUTOMATISATION AVEC GITHUB ACTIONS
# =============================================================
#  GitHub lance ce "workflow" sur ses propres serveurs (Linux),
#  gratuitement, même quand mon ordinateur est éteint :
#    tests -> collecte -> tri -> site -> Discord -> sauvegarde -> publication
#
#  Les données (la base et les fichiers du site générés) vivent sur
#  la branche "data" : le code reste sur main, dont l'historique ne
#  contient ainsi que les vrais changements.
#
#  Les clés secrètes viennent de :
#  Settings > Secrets and variables > Actions
# =============================================================

name: Veille automatique

on:
  # Deux fois par jour. L'heure est en UTC (temps universel) :
  # 5h UTC = 7h à Paris en été (6h en hiver), 17h UTC = 19h (18h en hiver)
  schedule:
    - cron: "0 5,17 * * *"
  # Ajoute un bouton "Run workflow" pour lancer la veille à la main (démo)
  workflow_dispatch:

# Empêche deux veilles de tourner en même temps
concurrency:
  group: veille

jobs:
  veille:
    runs-on: ubuntu-latest
    # Autorise le job à enregistrer (push) la base sur la branche data
    permissions:
      contents: write
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Récupérer la base (branche data)
        run: |
          git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
          git restore --source=origin/data --worktree -- data/veille.db

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Lancer les tests
        id: tests
        run: python -m unittest -v tests

      - name: "Étape 1 : collecter les articles"
        run: python collecte.py

      - name: "Étape 2 : trier (mots-clés + IA)"
        run: python tri.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: "Bonus : l'essentiel de la semaine (tous les 7 jours)"
        run: python essentiel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: "Bonus : favoris (réactions ⭐ sur Discord)"
        run: python favoris.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_FAVORIS: ${{ secrets.DISCORD_WEBHOOK_FAVORIS }}

      # Les étapes suivantes tournent MÊME si une étape précédente a planté (mais pas si
      # les tests ont échoué) : la base enregistre son travail au fur et à mesure, et il
      # faut sauvegarder ce qui a été fait. Sinon, un article déjà envoyé sur Discord
      # ne serait pas marqué comme envoyé dans le dépôt, et il serait renvoyé en double.
      - name: "Étape 3 : générer les données du site"
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python generer_site.py

      - name: "Bonus : alertes Discord"
        run: python alerte_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Sauvegarder la base et les données du site (branche data)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: bash .github/sauvegarder-donnees.sh "Veille automatique du $(date -u +'%d/%m/%Y %Hh%M') UTC"

  # Publie le site avec les nouvelles données, même si une étape de la veille a planté
  # (ce qui a été fait est sauvegardé, autant l'afficher).
  site:
    needs: veille
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
