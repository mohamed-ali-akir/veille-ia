# =============================================================
#  ÉTAPE 4 : AUTOMATISATION AVEC GITHUB ACTIONS
# =============================================================
#  GitHub lance ce "workflow" sur ses propres serveurs (Linux),
#  gratuitement, même quand mon ordinateur est éteint :
#    tests -> collecte -> tri -> site -> Discord -> sauvegarde
#
#  Les clés secrètes viennent de :
#  Settings > Secrets and variables > Actions
# =============================================================

name: Veille automatique

on:
  # Deux fois par jour. L'heure est en UTC (temps universel) :
  # 5h UTC = 7h à Paris en été (6h en hiver), 17h UTC = 19h (18h en hiver)
  schedule:
    - cron: "0 5,17 * * *"
  # Ajoute un bouton "Run workflow" pour lancer la veille à la main (démo)
  workflow_dispatch:

# Autorise le workflow à enregistrer (push) la base et le site dans le dépôt
permissions:
  contents: write

# Empêche deux veilles de tourner en même temps
concurrency:
  group: veille

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Lancer les tests
        id: tests
        run: python -m unittest -v tests

      - name: "Étape 1 : collecter les articles"
        run: python collecte.py

      - name: "Étape 2 : trier (mots-clés + IA)"
        run: python tri.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: "Bonus : l'essentiel de la semaine (tous les 7 jours)"
        run: python essentiel.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: "Bonus : favoris (réactions ⭐ sur Discord)"
        run: python favoris.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_FAVORIS: ${{ secrets.DISCORD_WEBHOOK_FAVORIS }}

      # Les étapes suivantes tournent MÊME si une étape précédente a planté (mais pas si
      # les tests ont échoué) : la base enregistre son travail au fur et à mesure, et il
      # faut sauvegarder ce qui a été fait. Sinon, un article déjà envoyé sur Discord
      # ne serait pas marqué comme envoyé dans le dépôt, et il serait renvoyé en double.
      - name: "Étape 3 : générer les données du site"
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python generer_site.py

      - name: "Bonus : alertes Discord"
        run: python alerte_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Sauvegarder la base et le site dans le dépôt
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille.db docs/articles.json docs/flux.xml
          # On ne crée un commit que s'il y a du nouveau
          git diff --staged --quiet && exit 0
          git commit -m "Veille automatique du $(date -u +'%d/%m/%Y %Hh%M') UTC"
          # Si quelqu'un a poussé un commit pendant la veille, le push est refusé :
          # on récupère ce commit puis on réessaie (3 fois maximum)
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push refusé, nouvel essai dans 10 secondes..."
            sleep 10
          done
          exit 1
