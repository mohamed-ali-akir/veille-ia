# =============================================================
#  FAVORIS : synchronisation rapide des réactions ⭐ Discord
# =============================================================
#  Workflow léger, séparé de la veille principale :
#  il lit seulement les réactions ⭐ (pas d'IA, pas de quota),
#  toutes les 5 minutes, et ne sauvegarde et ne republie le site
#  QUE si mes favoris ont changé.
#
#  Pourquoi pas en temps réel ? Il faudrait un bot connecté
#  en permanence sur un serveur allumé 24h/24 (payant).
#  5 minutes (le minimum autorisé par GitHub) est un bon compromis, gratuit.
# =============================================================

name: Favoris Discord

on:
  # Toutes les 5 minutes, le minimum de GitHub (qui peut prendre quelques minutes de retard)
  schedule:
    - cron: "*/5 * * * *"
  # Bouton "Run workflow" pour une mise à jour immédiate (démo)
  workflow_dispatch:

# Même groupe que la veille principale : les deux workflows ne tournent
# jamais en même temps, donc ne modifient jamais veille.db en même temps
concurrency:
  group: veille

jobs:
  favoris:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      change: ${{ steps.sauvegarde.outputs.change }}
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Récupérer la base (branche data)
        run: |
          git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
          git restore --source=origin/data --worktree -- data/veille.db docs/articles.json docs/flux.xml

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # favoris.py et generer_site.py n'utilisent que des bibliothèques
      # intégrées à Python : pas besoin de "pip install"
      - name: Lire les réactions ⭐ sur Discord
        run: python favoris.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_WEBHOOK_FAVORIS: ${{ secrets.DISCORD_WEBHOOK_FAVORIS }}

      - name: Sauvegarder si les favoris ont changé
        id: sauvegarde
        run: |
          # Même empreinte que la base de la branche data = favoris inchangés
          if [ "$(git hash-object data/veille.db)" = "$(git rev-parse origin/data:data/veille.db)" ]; then
            echo "Aucun changement de favoris : rien à faire."
            echo "change=false" >> "$GITHUB_OUTPUT"
          else
            python generer_site.py
            bash .github/sauvegarder-donnees.sh "Favoris mis à jour depuis Discord"
          fi

  # Republie le site seulement si les favoris ont changé
  site:
    needs: favoris
    if: ${{ needs.favoris.outputs.change == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
